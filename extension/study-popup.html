<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课堂助手 · SCUT 课堂助手</title><link rel="stylesheet" href="assistant.css"></head><body class="popup">

<header class="popup-head"><a class="brand" href="welcome.html" target="_blank"><span class="brand-mark" data-icon="wave"></span><span>SCUT 课堂助手</span></a><span id="connection" class="chip warn">检查连接</span></header>
<div class="stack">
<div class="card course-card"><h2 id="course">正在读取课时…</h2><p id="lesson" class="muted"></p><div id="source" class="footnote"></div></div>
<div class="setting-row"><div><strong id="analysis-label">DeepSeek 智能分析</strong><p>课堂提醒与课后总结 · 按需开启</p></div><label class="toggle"><input type="checkbox" id="analysis" aria-labelledby="analysis-label"><span class="switch"></span></label></div>
<button id="expand-room" class="primary" title="只打开或恢复窗口，不会重新开始录音">打开课堂实况 ↗</button><p id="lifecycle-note" class="lifecycle-note">这里只是操作面板，关闭不会结束录音。</p>
<section id="live-context" class="popup-context" hidden><div class="row between"><span>刚刚听到</span><button id="session-detail" class="text-button">本课详情 →</button></div><div id="live-sentences"></div></section>
<div class="capture-controls"><button class="primary capture-button" id="start" disabled><span data-icon="wave"></span><span>开始实时字幕</span></button><button id="stop" class="danger" disabled hidden>结束录音并保存</button></div>
<button id="process"><span data-icon="play"></span> 处理本节回放</button>
<div id="message" class="notice hidden" role="status"></div><div class="recorder-state"><span class="mini-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><span id="recorder"></span></div>
<p class="privacy-note">仅捕获当前课时声音；字幕在本机保存。开启分析会发送转写文字至 DeepSeek。回放实时字幕请使用 1 倍速。</p>
<div class="popup-nav"><button id="dashboard"><span data-icon="grid"></span>所有课程 / 历史记录</button><button id="options"><span data-icon="settings"></span>偏好设置</button></div>
<details class="popup-more"><summary>关了以后，怎么回来？⌄</summary><p class="footnote">点击 Edge 右上角的扩展图标 → SCUT 课堂助手 → 返回课堂实况。点击扩展名称只打开面板，不会重启录音。把它固定到工具栏，下次一点就能找到。</p><p class="footnote">仅在升级时使用扩展管理页的“重新加载”，它会中断录音。上课时保持学校播放页、浏览器和本地服务运行。</p><div class="row"><button id="recover">恢复暂存上传</button><button id="legacy">原版字幕下载</button></div><p class="footnote"><a href="welcome.html#daily-use" target="_blank">完整使用指南 →</a></p></details></div><script src="client.js"></script><script src="ui.js"></script><script src="session-view.js"></script><script src="study-popup.js"></script></body></html>
