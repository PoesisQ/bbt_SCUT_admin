<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课堂实况 · SCUT 课堂助手</title><link rel="stylesheet" href="assistant.css"><link rel="stylesheet" href="classroom.css"></head>
<body class="classroom"><header class="room-titlebar"><a class="brand" href="dashboard.html" target="_blank" rel="noopener" title="打开课程笔记与历史记录"><span class="brand-mark" data-icon="wave"></span><span>课堂实况</span></a><div class="row"><span id="room-status" class="chip warn">连接中</span><button id="minimize" class="room-minimize" title="最小化此窗，录音继续" aria-label="最小化课堂窗">−</button></div></header>
<main class="room-main"><section class="room-heading"><h1 id="room-course">等待课堂的声音。</h1><p id="room-lesson" class="muted">开始实时字幕后，完整的上下文会连续留在这里。</p><div class="room-metrics"><span id="room-clock">00:00:00</span><span id="room-count">0 条字幕</span><span id="room-language">自动识别语言</span></div><nav class="room-navigation" aria-label="课堂记录入口"><a id="room-details" href="dashboard.html" target="_blank" rel="noopener">本课详情与总结 →</a><a href="dashboard.html" target="_blank" rel="noopener">课程笔记</a></nav></section>
<section class="room-controls"><div class="setting-row"><div><strong id="room-analysis-label">课堂实时提醒</strong><p id="room-analysis-status">保留你的开关选择</p></div><label class="toggle"><input id="room-analysis" type="checkbox" aria-labelledby="room-analysis-label"><span class="switch"></span></label></div><div class="room-model"><span data-icon="spark"></span><label for="room-model">分析模型</label><select id="room-model"><option value="deepseek-v4-flash">V4 Flash</option><option value="deepseek-v4-pro">V4 Pro</option></select><a href="options.html#intelligence" target="_blank" rel="noopener" aria-label="更多模型设置"><span data-icon="settings"></span></a></div></section>
<div id="room-message" class="notice hidden" role="status"></div>
<div class="room-tabs"><div class="tabs" role="tablist" aria-label="课堂内容"><button class="active" data-room-view="transcript" role="tab" aria-selected="true">连续字幕</button><button data-room-view="events" role="tab" aria-selected="false">重点提醒 <span id="room-event-count">0</span></button></div><button id="follow" class="follow active" title="切回末尾并跟随最新字幕">跟随最新 ↓</button></div>
<section id="room-transcript" class="room-transcript" aria-label="连续课堂字幕"><div id="room-empty" class="room-empty"><span data-icon="wave"></span><h2>每句话，都有上下文。</h2><p>在课程播放页打开扩展，点击「开始实时字幕」。<br>这个窗口可以一直展开，也可以最小化。</p></div></section><section id="room-events" class="room-events" aria-label="重点提醒列表" hidden></section>
</main><aside class="room-lifecycle"><span id="room-lifecycle">关闭此窗口不会结束录音。再点浏览器中的助手即可回来。</span><a href="welcome.html#daily-use" target="_blank" rel="noopener">怎么使用？</a></aside><footer class="room-footer"><span id="room-save">字幕保存在本机</span><div class="row"><button id="room-overlay" title="在当前录音的课程页显示新版字幕浮层">字幕浮层</button><button id="room-export" disabled title="导出当前课时">导出</button><button id="room-stop" class="danger" disabled>结束录音并保存</button></div></footer>
<script src="client.js"></script><script src="ui.js"></script><script src="session-view.js"></script><script src="classroom.js"></script></body></html>
